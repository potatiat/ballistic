name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  BUILD_DIRECTORY: ${{ github.workspace }}/build

jobs:
  get-commits:
    name: Get Commits to Build
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.get-commits.outputs.commits }}
      short_sha: ${{ steps.get-short-sha.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Commits
        id: get-commits
        run: >-
          bash tools/scripts/get_commits.sh
          "${{ github.event_name }}"
          "${{ github.event.before }}"
          "${{ github.event.after }}"
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          "${{ github.sha }}"

  Build-Linux:
    needs: get-commits
    name: Ubuntu / ${{ matrix.type }} / (${{ matrix.commit.index }}) ${{ matrix.commit.short_sha }} ${{ matrix.commit.message }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type: [ Debug, Release ]
        commit: ${{ fromJson(needs.get-commits.outputs.commits) }}
    env:
      CC: clang-18
      CXX: clang++-18
      CCACHE_COMPRESS: true
      CCACHE_MAX_SIZE: 5G
      CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.commit.sha }}
          submodules: recursive
          fetch-depth: 1

      - name: Install System Dependencies
        run: bash tools/scripts/setup_dependencies.sh apt

      - name: Setup Compiler Cache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-clang-18-${{ matrix.type }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-clang-18-${{ matrix.type }}-ccache-

      - name: Prepare ccache
        run: |
          mkdir -p ~/.ccache
          ccache -z       
          ccache -M 5G
          ccache -s     

      - name: Configure CMake
        run: cmake --preset ${{ matrix.type == 'Debug' && 'debug' || 'release' }}

      - name: Build Project
        run: cmake --build --preset ${{ matrix.type == 'Debug' && 'debug' || 'release' }}

      - name: Run Test Suite
        if: matrix.type == 'Debug'
        run: ctest --preset debug

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Ballistic-Engine Linux ${{ matrix.type }} Build ${{ matrix.commit.short_sha }}
          path: |
            build/bin/**
            build/lib/**
  
  
  Build-Windows:
    needs: get-commits
    name: Windows / ${{ matrix.type }} / (${{ matrix.commit.index }}) ${{ matrix.commit.short_sha }} ${{ matrix.commit.message }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        type: [ Debug, Release ]
        commit: ${{ fromJson(needs.get-commits.outputs.commits) }}
    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.commit.sha }}
          submodules: recursive
          fetch-depth: 1

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Dependencies
        run: pwsh tools/scripts/setup_dependencies.ps1

      - name: Setup sccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-msvc-${{ matrix.type }}-sccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-msvc-${{ matrix.type }}-sccache-

      - name: Disable Windows Defender Scanning
        shell: pwsh
        run: |
          $buildPath = "${{ github.workspace }}\build"
          if (!(Test-Path $buildPath)) { New-Item -ItemType Directory -Path $buildPath -Force | Out-Null }
          Add-MpPreference -ExclusionPath $buildPath -ErrorAction SilentlyContinue
          Write-Host "✓ Build directory excluded from Windows Defender"

      - name: Configure CMake
        run: cmake --preset ${{ matrix.type == 'Debug' && 'debug-windows' || 'release-windows' }}

      - name: Build Project
        run: cmake --build --preset ${{ matrix.type == 'Debug' && 'debug-windows' || 'release-windows' }}

      - name: Run Test Suite
        if: matrix.type == 'Debug'
        run: ctest --preset debug-windows

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Ballistic-Engine Windows ${{ matrix.type }} Build ${{ matrix.commit.short_sha }}
          path: |
            build/bin/**
            build/lib/**

